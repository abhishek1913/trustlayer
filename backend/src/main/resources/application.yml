spring:
  application:
    name: trustlayer
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trustlayer}
    username: ${DB_USER:trustlayer}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

trustlayer:
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    issuer: trustlayer
  auth:
    refresh-ttl: 7d
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    max-failed-logins: 5
    lock-duration: 15m
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:10}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    api-base: ${STRIPE_API_BASE:}
    connect-timeout-millis: 5000
    read-timeout-millis: 15000
  verification:
    provider: ${IDENTITY_PROVIDER:mock}
    session-ttl: ${VERIFICATION_SESSION_TTL:60m}
    max-attempts: 3
    mock-webhook-secret: ${IDENTITY_MOCK_WEBHOOK_SECRET:}
    stripe-webhook-secret: ${STRIPE_IDENTITY_WEBHOOK_SECRET:}
  payment:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:3000/payment/cancel}
    price-ids:
      basic_monthly: ${STRIPE_PRICE_BASIC_MONTHLY:}
      pro_monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
  notification:
    email-provider: ${EMAIL_PROVIDER:mock}
    whatsapp-provider: ${WHATSAPP_PROVIDER:mock}
    mock-log-body: ${MOCK_NOTIFICATION_LOG_BODY:false}
    mock-fail: ${MOCK_NOTIFICATION_FAIL:false}
    max-attempts: 3
    backoff: ${NOTIFICATION_BACKOFF:2s}
    mail-from: ${MAIL_FROM:no-reply@trustlayer.local}
    meta:
      api-base: ${META_API_BASE:https://graph.facebook.com}
      api-version: ${META_API_VERSION:v21.0}
      phone-number-id: ${META_PHONE_NUMBER_ID:}
      access-token: ${META_ACCESS_TOKEN:}
